<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/static/registrerenLeerling.css">
    <script src="/static/registrerenLeerling.js" defer></script>
</head>

<body>
    <div class="MiddenBlok">
        <div class="LogoDiv">
            <img src="/static/Logo.png" alt="Logo" class="Logo">
        </div>
        <form id="RegistratieForm" class="RegistratieForm">
            <div class="InputBlok">
                <input class="Input" type="text" name="Voornaam" id="VoornaamInput" placeholder="Voornaam" required>
            </div>
            <div class="InputBlok">
                <input class="Input" type="text" name="Achternaam" id="AchternaamInput" placeholder="Achternaam" required>
            </div>
            <div class="InputBlok">
                <input class="Input" type="email" name="Email" id="EmailInput" placeholder="Email" required>
            </div>
            <div class="Foutmelding" id="Foutmelding"></div>
            <div class="SubmitBlok" id="SubmitBlok">
                <button type="submit" class="LoginKnop" id="SubmitKnop">Ga door</button>
            </div>

        </form>

        <div class="RegistreerDiv">
            <p>Heb je al een account? <a href="{{ url_for('loginLeerling') }}">Log in.</a></p>
        </div>

    </div>
</body>
</html>
